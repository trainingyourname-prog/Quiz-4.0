<!DOCTYPE html>
    <html lang="bn">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>General Science</title>

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

        <style>

            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                font-family:'Poppins',sans-serif;
            }

            body{

                background:linear-gradient(180deg,#6675F6,#7A4FC3);

                height:100vh;

                display:flex;

                justify-content:center;

                align-items:center;

            }

            .container{

                width:95%;

                max-width:420px;

                height:94vh;

                background:#fff;

                border-radius:30px;

                padding:18px;

                display:flex;

                flex-direction:column;

                overflow:hidden;

                box-shadow:0 12px 30px rgba(0,0,0,.18);

            }

            .title{

                text-align:center;

                margin-bottom:14px;

            }

            .title h1{

                font-size:28px;

                font-weight:700;

                color:#111;

            }

            .title h2{

                font-size:16px;

                font-weight:500;

                color:#8A8A8A;

                margin-top:4px;

            }

            .subtitle{

                font-size:14px;

                color:#16B84B;

                font-weight:600;

                margin-top:6px;

            }

            .search-box{

                margin:15px 0;

            }

            .search-box input{

                width:100%;

                padding:13px 16px;

                border:none;

                outline:none;

                background:#F5F6FB;

                border-radius:15px;

                font-size:15px;

                transition:.3s;

            }

            .search-box input:focus{

                box-shadow:0 0 0 2px #16B84B;

            }

            .chapter-list{

                flex:1;

                overflow-y:auto;

                padding-right:4px;

                scroll-behavior:smooth;

            }

            .chapter-list::-webkit-scrollbar{

                width:5px;

            }

            .chapter-list::-webkit-scrollbar-thumb{

                background:linear-gradient(135deg,#01ff2c,#e101ff);

                border-radius:20px;

            }

            .chapter-card{

                display:flex;

                align-items:center;

                justify-content:center;

                text-align:center;

                text-decoration:none;

                background:#464b48;

                color:#fff;

                padding:15px;

                border-radius:16px;

                margin-bottom:10px;

                transition:.25s;

            }

            .chapter-card:hover{
                transform:translateY(-2px);
                box-shadow:0 10px 20px rgba(22,184,75,.35);
            }

            .chapter-card h3{

                font-size:18px;

                font-weight:600;

                line-height:1.4;

            }

            .back-btn{

                display:block;

                text-decoration:none;

                text-align:center;

                background:linear-gradient(90deg,#6375F6,#6E63F8);

                color:#fff;

                font-size:20px;

                font-weight:700;

                padding:14px;

                border-radius:16px;

                margin-top:12px;

                transition:.3s;

            }

            .back-btn:hover{

                transform:scale(1.02);

            }

        </style>

    </head>

    <body>

        <div class="container">

            <div class="title">

                <h1>Physical Science</h1>

                <h2>All Part</h2>

                <p class="subtitle">Tap to Start</p>

            </div>

            <div class="search-box">

                <input
                type="text"
                id="searchBox"
                placeholder="🔍 Search Topic...">

            </div>

            <div class="chapter-list">
                
                <a href="#" class="chapter-card">
                    <h3>Part - 1</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 2</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 3</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 4</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 5</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 6</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 7</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 8 </h3>
                </a>
                    
                <a href="#" class="chapter-card">
                    <h3>Part - 9</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 10</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 11</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 12</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 13</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 14</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 15</h3>
                </a>

                <a href="#" class="chapter-card">
                    <h3>Part - 16 </h3>
                </a>

            </div>

            <a href="../Choose Subject.html" class="back-btn">← Back</a>

        </div>

        <script>

            const searchBox = document.getElementById("searchBox");
            const cards = document.querySelectorAll(".chapter-card");

            searchBox.addEventListener("keyup", function(){

                const value = this.value.toLowerCase();

                cards.forEach(function(card){

                    if(card.innerText.toLowerCase().includes(value)){

                        card.style.display = "flex";

                    }else{

                        card.style.display = "none";

                    }

                });

            });

            cards.forEach(function(card){

                card.addEventListener("click",function(){

                    this.style.transform="scale(.98)";

                    setTimeout(()=>{

                        this.style.transform="scale(1)";

                    },120);

                });

            });

                
            /* Page Fade Animation */

            window.addEventListener("load", function(){

                document.body.style.opacity = "0";
                document.body.style.transition = "opacity .4s ease";

                setTimeout(function(){

                    document.body.style.opacity = "1";

                },100);

            });

            /* Smooth Scroll */

            document.querySelector(".chapter-list").style.scrollBehavior = "smooth";

            /* Search Box Clear করলে সব Card দেখাবে */

            searchBox.addEventListener("search", function(){

                cards.forEach(function(card){

                    card.style.display = "flex";

                });

            });

        </script>

    </body>
</html>
