<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভারতের ইতিহাস ও স্বাধীনতা সংগ্রাম</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:linear-gradient(to bottom,#6478e8,#7752b5);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:90%;
            max-width:380px;
            height:85vh;
            background:#fff;
            border-radius:30px;
            padding:25px;
            box-shadow:0 10px 25px rgba(0,0,0,.2);

            display:flex;
            flex-direction:column;
        }

        h1{
            text-align:center;
            color:#222;
            margin-bottom:20px;
            font-size:34px;
        }

        .subject-list{
            flex:1;
            overflow-y:auto;
            padding-right:5px;
            margin-top:15px;
        }

        .subject-list::-webkit-scrollbar{
            width:6px;
        }

        .subject-list::-webkit-scrollbar-thumb{
            background:#4CAF50;
            border-radius:10px;
        }

        .subject-btn{
            display:block;
            width:100%;
            text-decoration:none;
            text-align:center;
            background:#4CAF50;
            color:#fff;
            font-size:22px;
            font-weight:bold;
            padding:18px;
            margin-bottom:15px;
            border-radius:15px;
            transition:.3s;
        }

        .subject-btn:hover{
            background:#43a047;
            transform:scale(1.02);
        }

        .back-btn{
            display:block;
            text-decoration:none;
            background:#00aeff;
            color:#fff;
            text-align:center;
            padding:16px;
            border-radius:15px;
            margin-top:15px;
            font-size:22px;
            font-weight:bold;
        }

        .back-btn:hover{
            background:#ff00d4;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>ভারতের ইতিহাস ও স্বাধীনতা সংগ্রাম</h1>

    <div class="subject-list">

        <a href="#" class="subject-btn">প্রাথমিক ভারত</a>

        <a href="#" class="subject-btn">মধ্যযুগীয় ভারত</a>

        <a href="#" class="subject-btn">আধুনিক ভারত</a>

    </div>

    <a href="../General Awareness.html" class="back-btn">← Back</a>

</div>

</body>
</html>
