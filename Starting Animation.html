<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Welcome</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

width:100%;
height:100vh;

overflow:hidden;

display:flex;

justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
#081229,
#102D66,
#1464C7,
#18A4FF);

background-size:400% 400%;

animation:bgMove 12s ease infinite;

}

/* Animated Background */

@keyframes bgMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

/* Floating Lights */

.bg{

position:absolute;
width:100%;
height:100%;

overflow:hidden;

}

.light{

position:absolute;

border-radius:50%;

background:rgba(255,255,255,.12);

backdrop-filter:blur(5px);

animation:float 10s infinite ease-in-out;

}

.l1{

width:220px;
height:220px;

left:-80px;
top:-60px;

}

.l2{

width:160px;
height:160px;

right:-40px;
top:120px;

animation-duration:12s;

}

.l3{

width:260px;
height:260px;

bottom:-120px;
right:-90px;

animation-duration:15s;

}

.l4{

width:120px;
height:120px;

left:10%;
bottom:25%;

animation-duration:9s;

}

@keyframes float{

0%{

transform:
translateY(0px)
rotate(0deg);

}

50%{

transform:
translateY(-30px)
rotate(180deg);

}

100%{

transform:
translateY(0px)
rotate(360deg);

}

}

/* Main Card */

.card{

position:relative;

width:92%;
max-width:420px;

padding:40px 25px;

text-align:center;

border-radius:35px;

background:
rgba(255,255,255,.12);

border:
1px solid rgba(255,255,255,.25);

backdrop-filter:blur(25px);

box-shadow:
0 20px 50px rgba(0,0,0,.35);

z-index:10;

}

/* Welcome */

#welcome{

font-size:18px;

font-weight:700;

letter-spacing:7px;

color:#fff;

opacity:0;

}

/* Title */

#title{

margin-top:20px;

font-size:38px;

font-weight:800;

line-height:1.3;

opacity:0;

background:
linear-gradient(
90deg,
#ffffff,
#00E5FF,
#7CFFCB,
#ffffff);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

/* Subtitle */

#subtitle{

margin-top:18px;

font-size:17px;

line-height:1.8;

color:#EAF7FF;

opacity:0;

}
  
/* ============================
   LOGO
============================ */

#logo{

width:150px;
height:150px;

margin:35px auto 0;

display:none;

object-fit:cover;

border-radius:50%;

border:5px solid rgba(255,255,255,.35);

box-shadow:
0 0 25px rgba(255,255,255,.45),
0 0 60px rgba(0,229,255,.35);

}

/* ============================
   LOADING
============================ */

#loadingBox{

display:none;

margin-top:35px;

}

#loadingText{

font-size:18px;

font-weight:600;

color:#fff;

letter-spacing:2px;

margin-bottom:15px;

}

.progress{

width:100%;

height:12px;

background:
rgba(255,255,255,.18);

border-radius:30px;

overflow:hidden;

box-shadow:
0 0 15px rgba(255,255,255,.15);

}

#bar{

width:0%;

height:100%;

border-radius:30px;

background:
linear-gradient(
90deg,
#00E5FF,
#00FFB3,
#9CFF2E);

}

#percent{

margin-top:15px;

font-size:22px;

font-weight:700;

color:#fff;

}

/* ============================
   FADE
============================ */

.fade{

animation:fade .8s forwards;

}

@keyframes fade{

from{

opacity:0;

transform:
translateY(25px);

}

to{

opacity:1;

transform:
translateY(0);

}

}

/* ============================
   LOGO EFFECT
============================ */

.logo-show{

display:block !important;

animation:

logoGlow 2s infinite,

logoFloat 3s infinite ease-in-out,

logoZoom 1.2s;

}

@keyframes logoGlow{

0%{

box-shadow:
0 0 20px white;

}

50%{

box-shadow:
0 0 50px cyan;

}

100%{

box-shadow:
0 0 20px white;

}

}

@keyframes logoFloat{

0%{

transform:
translateY(0);

}

50%{

transform:
translateY(-12px);

}

100%{

transform:
translateY(0);

}

}

@keyframes logoZoom{

0%{

transform:
scale(.4);

opacity:0;

}

100%{

transform:
scale(1);

opacity:1;

}

}

/* ============================
   MOBILE
============================ */

@media(max-width:480px){

.card{

padding:35px 20px;

}

#title{

font-size:31px;

}

#subtitle{

font-size:15px;

}

#logo{

width:120px;
height:120px;

}

}
  
</style>
  
<body>
    
<div class="bg">

<div class="light l1"></div>

<div class="light l2"></div>

<div class="light l3"></div>

<div class="light l4"></div>

</div>

<div class="card">

<h3 id="welcome">
WELCOME
</h3>

<h1 id="title">
TO MY APP
</h1>

<p id="subtitle">
Learn • Practice • Success
</p>

<img
src="logo 1.jpg"
id="logo"
alt="Logo">

<div id="loadingBox">

<div id="loadingText">

Loading...

</div>

<div class="progress">

<div id="bar"></div>

</div>

<div id="percent">

0%

</div>

</div>

</div>
    
</body>
  
<script>

/* ============================
   ELEMENTS
============================ */

const welcome =
document.getElementById("welcome");

const title =
document.getElementById("title");

const subtitle =
document.getElementById("subtitle");

const logo =
document.getElementById("logo");

const loadingBox =
document.getElementById("loadingBox");

const loadingText =
document.getElementById("loadingText");

/* ============================
   SHOW ANIMATION
============================ */

setTimeout(function(){

welcome.classList.add("fade");

},300);

setTimeout(function(){

title.classList.add("fade");

},1200);

setTimeout(function(){

subtitle.classList.add("fade");

},2200);

/* ============================
   LOGO SHOW
============================ */

setTimeout(function(){

logo.classList.add("logo-show");

},3600);

/* ============================
   TYPING EFFECT
============================ */

const text =
"Prepare Yourself For Success";

let i = 0;

subtitle.innerHTML = "";

function typeText(){

if(i < text.length){

subtitle.innerHTML += text.charAt(i);

i++;

setTimeout(typeText,60);

}

}

setTimeout(typeText,2400);

/* ============================
   SHOW LOADING BOX
============================ */

setTimeout(function(){

loadingBox.style.display = "block";

loadingBox.classList.add("fade");

},5000);
  
/* ============================
   LOADING BAR
============================ */

const bar =
document.getElementById("bar");

const percent =
document.getElementById("percent");

function startLoading(){

let progress = 0;

const timer = setInterval(function(){

progress++;

bar.style.width = progress + "%";

percent.innerHTML = progress + "%";

/* Loading Text Animation */

if(progress < 30){

loadingText.innerHTML = "Initializing...";

}else if(progress < 60){

loadingText.innerHTML = "Loading Resources...";

}else if(progress < 90){

loadingText.innerHTML = "Preparing App...";

}else{

loadingText.innerHTML = "Almost Ready...";

}

if(progress >= 100){

clearInterval(timer);

loadingText.innerHTML = "Welcome!";

setTimeout(function(){

openApp();

},700);

}

},35);

}

/* ============================
   START LOADING
============================ */

setTimeout(function(){

startLoading();

},5200);

/* ============================
   OPEN LOGIN PAGE
============================ */

function openApp(){

document.body.style.transition =
"opacity .8s";

document.body.style.opacity = "0";

setTimeout(function(){

window.location.href =
"Login Home Page.html";

},800);

}
  

/* ======================================
   PREMIUM EFFECTS
====================================== */

/* ---------- Create Stars ---------- */

for(let i=0;i<80;i++){

const star=document.createElement("div");

star.style.position="absolute";

star.style.width="2px";

star.style.height="2px";

star.style.background="#fff";

star.style.borderRadius="50%";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

star.style.opacity=Math.random();

star.style.animation=
"twinkle "+
(2+Math.random()*3)+"s infinite";

document.body.appendChild(star);

}

/* ---------- Twinkle Animation ---------- */

const style=document.createElement("style");

style.innerHTML=`

@keyframes twinkle{

0%{

opacity:.2;
transform:scale(.6);

}

50%{

opacity:1;
transform:scale(1.4);

}

100%{

opacity:.2;
transform:scale(.6);

}

}

@keyframes shooting{

0%{

transform:
translate(-200px,-100px)
rotate(35deg);

opacity:1;

}

100%{

transform:
translate(130vw,90vh)
rotate(35deg);

opacity:0;

}

}

`;

document.head.appendChild(style);

/* ---------- Shooting Star ---------- */

setInterval(function(){

const s=document.createElement("div");

s.style.position="absolute";

s.style.width="150px";

s.style.height="2px";

s.style.background=
"linear-gradient(90deg,#fff,transparent)";

s.style.left="-150px";

s.style.top=
Math.random()*40+"%";

s.style.transform=
"rotate(35deg)";

s.style.animation=
"shooting 2s linear";

document.body.appendChild(s);

setTimeout(function(){

s.remove();

},2000);

},3500);

/* ---------- Phone Vibration ---------- */

if(navigator.vibrate){

setTimeout(function(){

navigator.vibrate([150,80,150]);

},6000);

}

/* ---------- Logo Shine ---------- */

setInterval(function(){

logo.animate([

{

filter:
"brightness(1)"

},

{

filter:
"brightness(1.8)"

},

{

filter:
"brightness(1)"

}

],{

duration:1200

});

},2500);

/* ---------- Floating Card ---------- */

document.querySelector(".card")

.animate([

{

transform:"translateY(0px)"

},

{

transform:"translateY(-8px)"

},

{

transform:"translateY(0px)"

}

],{

duration:3500,

iterations:Infinity

});

console.log("Premium Intro Loaded");
  
/* ======================================
   PART 6 : FINAL PREMIUM FEATURES
====================================== */

/* ---------- Welcome Sound ---------- */

function playWelcomeSound(){

if(typeof AudioContext==="undefined" &&
typeof webkitAudioContext==="undefined"){
return;
}

const AudioCtx =
window.AudioContext ||
window.webkitAudioContext;

const ctx = new AudioCtx();

const osc = ctx.createOscillator();
const gain = ctx.createGain();

osc.type = "triangle";
osc.frequency.value = 650;

gain.gain.value = 0.06;

osc.connect(gain);
gain.connect(ctx.destination);

osc.start();

setTimeout(function(){

osc.stop();
ctx.close();

},250);

}

setTimeout(playWelcomeSound,4500);

/* ---------- Logo Click Animation ---------- */

logo.addEventListener("click",function(){

logo.animate([

{
transform:"scale(1)"
},

{
transform:"scale(1.15)"
},

{
transform:"scale(1)"
}

],{

duration:600

});

});

/* ---------- Background Color Animation ---------- */

let colors = [

"#4F46E5",
"#2563EB",
"#06B6D4",
"#0EA5E9",
"#7C3AED"

];

let index = 0;

setInterval(function(){

document.body.style.background =
"linear-gradient(135deg,"
+ colors[index] + ","
+ colors[(index+1)%colors.length] + ")";

document.body.style.backgroundSize =
"400% 400%";

index++;

if(index>=colors.length){

index = 0;

}

},6000);

/* ---------- Disable Selection ---------- */

document.addEventListener("selectstart",function(e){

e.preventDefault();

});

/* ---------- Disable Context Menu ---------- */

document.addEventListener("contextmenu",function(e){

e.preventDefault();

});

/* ---------- Final Console ---------- */

console.log(
"Premium Intro Page Loaded Successfully"
);

</script>
  
</head>
</html>
