<!DOCTYPE html>
    <html lang="bn">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Geography Quiz</title>

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

        <style>

            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                font-family:'Poppins',sans-serif;
            }

            body{

                height:100vh;

                display:flex;

                justify-content:center;

                align-items:center;

                background:linear-gradient(180deg,#5F73F8,#7B4FC4);

            }

            .container{

                width:95%;

                max-width:420px;

                background:#fff;

                padding:35px 28px;

                border-radius:28px;

                text-align:center;

                box-shadow:0 15px 35px rgba(0,0,0,.18);

                animation:fadeIn .5s;

            }

            @keyframes fadeIn{

                from{

                    opacity:0;
                    transform:translateY(20px);

                }

                to{

                    opacity:1;
                    transform:translateY(0);

                }

            }

            .logo{

                width:90px;
                height:90px;

                margin:auto;

                margin-bottom:18px;

                border-radius:50%;

                background:linear-gradient(180deg,#18B84B,#0F9E3D);

                display:flex;

                justify-content:center;

                align-items:center;

                font-size:42px;

                color:#fff;

            }

            h1{

                font-size:30px;

                font-weight:700;

                color:#222;

                margin-bottom:8px;

            }

            .subtitle{

                font-size:16px;

                color:#777;

                margin-bottom:8px;

            }

            .info{

                font-size:15px;

                color:#18B84B;

                font-weight:600;

                margin-bottom:28px;

            }

            .start-btn{

                width:100%;

                padding:17px;

                border:none;

                border-radius:18px;

                background:linear-gradient(90deg,#18B84B,#23CF59);

                color:#fff;

                font-size:22px;

                font-weight:700;

                cursor:pointer;

                transition:.3s;

                box-shadow:0 8px 18px rgba(0,0,0,.15);

            }

            .start-btn:hover{

                transform:translateY(-2px);

            }

            .footer{

                margin-top:20px;

                font-size:13px;

                color:#999;

            }

        </style>

    </head>

    <body>

        <div class="container">

            <div class="logo">
                📘
            </div>

            <h1>Quiz</h1>

            <p class="subtitle">
                Geography
            </p>

            <p class="info">
            মোট ২৫টি প্রশ্ন
            </p>

            <button
                class="start-btn"
                onclick="startQuiz()">

                ▶ Start Quiz

            </button>

            <div class="footer">

                Powered by Quiz App

            </div>

        </div>

        <script>

            /* ==========================
            Question List
            ========================== */

            const questions = [
            
  {
    "q":"ভারতের বৃহত্তম পেট্রোলিয়াম কমপ্লেক্সটি কোথায় অবস্থিত?",
    "options":"মুম্বাই","বরোদা","কলকাতা","চেন্নাই",
    "answer":1
  },
  {
    "q":"ভারতের বৃহত্তম দুগ্ধ উৎপাদন সংস্থা (আমুল) গুজরাট রাজ্যের কোন স্থানে অবস্থিত?",
    "options":"সুরাট ও রাজকোট","আনন্দ ও কাইরা নগর","বরোদা ও আহমেদাবাদ","ভুজ ও জামনগর",
    "answer":1
  },
  {
    "q":"অলীকিক কমপ্লেক্সটি কোন শিল্পের জন্য বিখ্যাত?",
    "options":"লৌহ-ইস্পাত শিল্প","বস্ত্রশিল্প","পেট্রোকেমিক্যাল শিল্প","কাগজ শিল্প",
    "answer":2
  },
  {
    "q":"দক্ষিণাত্যের কৃষ্ণমৃত্তিকা অঞ্চলের প্রধান পর্বতের নাম কী?",
    "options":"আরাবল্লী","সহ্যাদ্রি","নীলগিরি","সাতপুরা",
    "answer":1
  },
  {
    "q":"ভীমা, কয়না ও ঘাটপ্রভা কোন নদীর উপনদী?",
    "options":"গোদাবরী","নর্মদা","কৃষ্ণা","কাবেরী",
    "answer":2
  },
  {
    "q":"প্রভরা, মুলা ও পূর্ণা কোন নদীর উপনদী?",
    "options":"কৃষ্ণা","গোদাবরী","নর্মদা","তাপ্তী",
    "answer":1
  },
  {
    "q":"ঔষধশিল্পে ভারতের প্রথম কোন অঞ্চলের প্রাধান্য রয়েছে?",
    "options":"লালমৃত্তিকা অঞ্চল","কৃষ্ণমৃত্তিকা অঞ্চল","পলিমাটি অঞ্চল","মরুমৃত্তিকা অঞ্চল",
    "answer":1
  },
  {
    "q":"ভারতীয় উপদ্বীপের উপকূলীয় রেখার দৈর্ঘ্য প্রায় কত কিমি?",
    "options":"৫,৫০০ কিমি","৬,০০০ কিমি","৭,৫০০ কিমি","৯,০০০ কিমি",
    "answer":2
  },
  {
    "q":"জবলপুরের কাছে ভেড়াঘাট জলপ্রপাতটি কোন নদীর উপর?",
    "options":"তাপ্তী","নর্মদা","গোদাবরী","কৃষ্ণা",
    "answer":1
  },
  {
    "q":"প্রাচীন তভিস্ত পর্বত আরাবল্লী বর্তমানে কী পর্বত?",
    "options":"নবীন ভঙ্গিল পর্বত","আগ্নেয় পর্বত","ক্ষয়জাত পর্বত","স্তুপ পর্বত",
    "answer":2
  },
  {
    "q":"লাক্ষাদ্বীপের রাজধানীর নাম কী?",
    "options":"আগাত্তি","কাভারাতি","মিনিকয়","আন্দ্রোথ",
    "answer":1
  },
  {
    "q":"আন্দামানের সর্বোচ্চ শৃঙ্গের নাম কী?",
    "options":"মাউন্ট হ্যারিয়েট","স্যাডল পিক","নীলগিরি","ধৌলাগিরি",
    "answer":1
  },
  {
    "q":"‘ইয়াং লুং হো’ নদী ভারতে কী নামে পরিচিত?",
    "options":"সিন্ধু","গঙ্গা","ব্রহ্মপুত্র","তিস্তা",
    "answer":2
  },
  {
    "q":"ভারত ও চীনের মধ্যে সীমা নির্ধারণকারী লাইনটির নাম কী?",
    "options":"র‍্যাডক্লিফ লাইন","ম্যাকমোহন লাইন","ডুরান্ড লাইন","১৭তম সমান্তরাল",
    "answer":1
  },
  {
    "q":"ভারতের Rail Factory কোথায় অবস্থিত?",
    "options":"কলকাতা","মুম্বাই","ব্যাঙ্গালোর","চেন্নাই",
    "answer":2
  },
  {
    "q":"নাথুলা পাস কোথায় অবস্থিত?",
    "options":"সিকিম","হিমাচল প্রদেশ","উত্তরাখণ্ড","অরুণাচল প্রদেশ",
    "answer":0
  },
  {
    "q":"দুটি ভূমি এলাকার মধ্যে সরু জলপ্রণালীকে কী বলা হয়?",
    "options":"উপসাগর","প্রণালী","বদ্বীপ","মোহনা",
    "answer":1
  },
  {
    "q":"ভারতের সবচেয়ে বড় জাহাজ প্রস্তুতকারী কোম্পানি কোনটি?",
    "options":"কোচিন শিপইয়ার্ড","হিন্দুস্থান শিপইয়ার্ড","মাজাগাঁও ডক","গার্ডেনরিচ শিপবিল্ডার্স",
    "answer":1
  },
  {
    "q":"বর্তমানে ‘মথুরা’ কী নামে পরিচিত?",
    "options":"লাহোর","ইসলামাবাদ","করাচি","পেশোয়ার",
    "answer":1
  },
  {
    "q":"উত্তর মেরুতে ধ্রুবতারার উন্নতি কত ডিগ্রি?",
    "options":"০°","২৩½°","৬৬½°","৯০°",
    "answer":3
  },
  {
    "q":"পশ্চিমঘাট পর্বত কোন জাতীয় পর্বতের উদাহরণ?",
    "options":"ভঙ্গিল পর্বত","তির্যক ভঙ্গ পর্বত","আগ্নেয় পর্বত","স্তুপ পর্বত",
    "answer":1
  },
  {
    "q":"পত বাঁধ কোন নদীতে দেখা যায়?",
    "options":"বিপাশা নদী","গঙ্গা","যমুনা","তিস্তা",
    "answer":0
  },
  {
    "q":"কালাহারি থেকে দক্ষিণ আফ্রিকায় প্রবাহিত উষ্ণ বায়ুর নাম কী?",
    "options":"বার্গ","বোরা","চিনুক","ফন",
    "answer":0
  },
  {
    "q":"আগ্নেয়ের বরফ কোন ঋতুতে দেখা যায়?",
    "options":"গ্রীষ্ম","বর্ষা","শরৎ","শীত",
    "answer":2
  },
  {
    "q":"আগাপে গাছের আঠা কোন কাজে লাগে?",
    "options":"কাগজ তৈরি","চুইংগাম তৈরি","কাপড় রং করা","ওষুধ তৈরি",
    "answer":1
  }

                
            ];
            
            /* ==========================
            START QUIZ FUNCTION
            ========================== */

            function startQuiz(){

                /* Save Questions */

                localStorage.setItem(
                    "quizQuestions",
                    JSON.stringify(questions)
                );

                /* Save Topic Name */

                localStorage.setItem(
                    "quizTitle",
                    "Quiz"
                );

                /* Reset Previous Result */

                localStorage.removeItem("quizScore");
                localStorage.removeItem("quizWrong");
                localStorage.removeItem("quizTime");

                /* Open Quiz Page */

                window.location.href =
                "../../Quiz Page.html";

            }

            /* ==========================
            PAGE LOAD ANIMATION
            ========================== */

            window.addEventListener("load",function(){

                document.body.style.opacity="0";

                document.body.style.transition=
                "opacity .5s ease";

                setTimeout(function(){

                    document.body.style.opacity="1";

                },100);

            });

            /* ==========================
            BUTTON CLICK EFFECT
            ========================== */

            const btn=
            document.querySelector(".start-btn");

            btn.addEventListener("click",function(){

                btn.style.transform="scale(.98)";

                setTimeout(function(){

                    btn.style.transform="scale(1)";

                },120);

            });

            /* ==========================
            END SCRIPT
            ========================== */

        </script>

    </body>

</html>
