<!DOCTYPE html>
    <html lang="bn">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Geography Quiz</title>

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

        <style>

            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                font-family:'Poppins',sans-serif;
            }

            body{

                height:100vh;

                display:flex;

                justify-content:center;

                align-items:center;

                background:linear-gradient(180deg,#5F73F8,#7B4FC4);

            }

            .container{

                width:95%;

                max-width:420px;

                background:#fff;

                padding:35px 28px;

                border-radius:28px;

                text-align:center;

                box-shadow:0 15px 35px rgba(0,0,0,.18);

                animation:fadeIn .5s;

            }

            @keyframes fadeIn{

                from{

                    opacity:0;
                    transform:translateY(20px);

                }

                to{

                    opacity:1;
                    transform:translateY(0);

                }

            }

            .logo{

                width:90px;
                height:90px;

                margin:auto;

                margin-bottom:18px;

                border-radius:50%;

                background:linear-gradient(180deg,#18B84B,#0F9E3D);

                display:flex;

                justify-content:center;

                align-items:center;

                font-size:42px;

                color:#fff;

            }

            h1{

                font-size:30px;

                font-weight:700;

                color:#222;

                margin-bottom:8px;

            }

            .subtitle{

                font-size:16px;

                color:#777;

                margin-bottom:8px;

            }

            .info{

                font-size:15px;

                color:#18B84B;

                font-weight:600;

                margin-bottom:28px;

            }

            .start-btn{

                width:100%;

                padding:17px;

                border:none;

                border-radius:18px;

                background:linear-gradient(90deg,#18B84B,#23CF59);

                color:#fff;

                font-size:22px;

                font-weight:700;

                cursor:pointer;

                transition:.3s;

                box-shadow:0 8px 18px rgba(0,0,0,.15);

            }

            .start-btn:hover{

                transform:translateY(-2px);

            }

            .footer{

                margin-top:20px;

                font-size:13px;

                color:#999;

            }

        </style>

    </head>

    <body>

        <div class="container">

            <div class="logo">
                📘
            </div>

            <h1>Quiz</h1>

            <p class="subtitle">
                Geography
            </p>

            <p class="info">
            মোট ১০টি প্রশ্ন
            </p>

            <button
                class="start-btn"
                onclick="startQuiz()">

                ▶ Start Quiz

            </button>

            <div class="footer">

                Powered by Quiz App

            </div>

        </div>

        <script>

            /* ==========================
            Question List
            ========================== */

            const questions = [
            
                {
                    "q":"আরবসাগরের রানী কাকে বলা হয়?",
                    "options":[
                    "মুম্বাই",
                    "কোচিন",
                    "গোয়া",
                    "বিশাখাপত্তনম"
                    ],
                    "answer":1
                },
                {
                    "q":"একটি কম্পিউটার নিয়ন্ত্রিত বন্দরের নাম লেখ?",
                    "options":[
                    "মুম্বাই বন্দর",
                    "হলদিয়া বন্দর",
                    "নভশেবা",
                    "কোচিন বন্দর"
                    ],
                    "answer":2
                },
                {
                    "q":"ভারতে বৃহত্তম সার কারখানা আছে—",
                    "options":[
                    "দুর্গাপুরে",
                    "সিন্দ্রিতে",
                    "রাউরকেলায়",
                    "বোকারোতে"
                    ],
                    "answer":1
                },
                {
                    "q":"ভারতের ম্যানচেস্টার কাকে বলা হয়?",
                    "options":[
                    "সুরাটকে",
                    "মুম্বাইকে",
                    "আমেদাবাদকে",
                    "কানপুরকে"
                    ],
                    "answer":2
                },
                {
                    "q":"ভারতের ক্ষুদ্রতম বন্দর হলো—",
                    "options":[
                    "কাণ্ডলা",
                    "হলদিয়া",
                    "কাতলা",
                    "কোচিন"
                    ],
                    "answer":2
                },
                {
                    "q":"চিনাবাদাম উৎপাদনে ভারতের মধ্যে প্রথম স্থান অধিকার করেছে—",
                    "options":[
                    "মহারাষ্ট্র",
                    "গুজরাট",
                    "রাজস্থান",
                    "মধ্যপ্রদেশ"
                    ],
                    "answer":1
                },
                {
                    "q":"কলকাতা বন্দরের সহযোগী বন্দর হলো—",
                    "options":[
                    "পারাদ্বীপ",
                    "হলদিয়া",
                    "কাণ্ডলা",
                    "কোচিন"
                    ],
                    "answer":1
                },
                {
                    "q":"মহারাষ্ট্রের একটি তাপবিদ্যুৎ কেন্দ্র হলো—",
                    "options":[
                    "তলচের",
                    "কোরবা",
                    "ট্রম্বে",
                    "ফরাক্কা"
                    ],
                    "answer":2
                },
                {
                    "q":"আসামের কোথায় ডিজেল বিদ্যুৎকেন্দ্র স্থাপিত হয়েছে?",
                    "options":[
                    "গৌহাটি",
                    "ডিব্রুগড়",
                    "ডিগবয়",
                    "শিলচর"
                    ],
                    "answer":2
                },
                {
                    "q":"তলচের তাপবিদ্যুৎ কেন্দ্রটি কোথায় অবস্থিত?",
                    "options":[
                    "ঝাড়খণ্ডে",
                    "ছত্তিশগড়ে",
                    "ওড়িশায়",

                },
                {
                    "q":"বঙ্গোপসাগরের অন্তর্গত কটি দ্বীপ আছে?",

                    "options":[

                    ],
                    "answer":1
                },
                {
                    "q":"সুয়েজ খালটি কোথায় অবস্থিত?",
                    "options":[
                    "ইরান",
                    "সৌদি আরব",
                    "ইজিপ্ট",
                    "তুরস্ক"
                    ],
                    "answer":2
                },
                {
                    "q":"Solar System-এর আবিষ্কারক কে?",
                    "options":[
                    "গ্যালিলিও",
                    "নিউটন",
                    "কোপার্নিকাস",
                    "কেপলার"
                    ],
                    "answer":2
                },
                {
                    "q":"বিশ্বে প্রথম মহাশূন্যে উঠেছিলেন কে?",
                    "options":[
                    "ইউরি গ্যাগারিন",
                    "নীল আর্মস্ট্রং",
                    "আলেক্সেই লিওনভ",
                    "ভ্যালেন্টিনা তেরেশকোভা"
                    ],
                    "answer":2
                },
                {
                    "q":"পৃথিবীর শীতলতম স্থান কোনটি?",
                    "options":[
                    "আন্টার্কটিকা",
                    "সাইবেরিয়া (ভারখয়ানস্ক)",
                    "গ্রিনল্যান্ড",
                    "আলাস্কা"
                    ],
                    "answer":1
                },
                {
                    "q":"ভারতবর্ষে মোট কটি দ্বীপ আছে?",
                    "options":[
                    "২৪৭টি",
                    "৩৫৭টি",
                    "৫৭২টি",
                    "৬০৭টি"
                    ],
                    "answer":0
                },
                {
                    "q":"পূর্বঘাট পর্বতের অপর নাম কী?",
                    "options":[
                    "আরাবল্লী",
                    "মালগিরি",
                    "সাতপুরা",
                    "নীলগিরি"
                    ],
                    "answer":1
                },
                {
                    "q":"পৃথিবীর উচ্চতম বিল্ডিং কোনটি?",
                    "options":[
                    "সাংহাই টাওয়ার",
                    "বুর্জ খলিফা",
                    "তাইপেই ১০১",
                    "ওয়ান ওয়ার্ল্ড ট্রেড সেন্টার"
                    ],
                    "answer":1
                },
                {
                    "q":"২০১১ সালের আদমসুমারী অনুযায়ী, ভারতের সবচেয়ে গরিব রাজ্য কোনটি?",
                    "options":[
                    "বিহার",
                    "ঝাড়খণ্ড",
                    "ওড়িশা",
                    "ছত্তিশগড়"
                    ],
                    "answer":3
                },
                {
                    "q":"আয়তনে বা জনসংখ্যায় বিশ্বের ক্ষুদ্রতম দেশ কী?",
                    "options":[
                    "মোনাকো",
                    "ভ্যাটিকান সিটি",
                    "সান মারিনো",
                    "লিচেনস্টাইন"
                    ],
                    "answer":1
                },
                {
                    "q":"কোন শহরকে “নীরব শহর” বলা হয়?",
                    "options":[
                    "প্যারিস",
                    "ভেনিস",
                    "রোম",
                    "এথেন্স"
                    ],
                    "answer":2
                },
                {
                    "q":"দৈর্ঘ্য, প্রস্থ, উচ্চতা—তিনটি মাত্রা, চতুর্থ মাত্রা কী?",
                    "options":[
                    "আলো",
                    "শক্তি",
                    "সময়",
                    "ভর"
                    ],
                    "answer":2
                },
                {
                    "q":"কসমিক ইয়ার (Cosmic Year) কী?",
                    "options":[
                    "পৃথিবীর সূর্যকে একবার প্রদক্ষিণের সময়",
                    "চাঁদের পৃথিবীকে একবার প্রদক্ষিণের সময়",
                    "যে সময়ে সৌরজগৎ ছায়াপথ (আকাশগঙ্গা)কে একবার প্রদক্ষিণ করে",
                    "সূর্যের নিজের অক্ষে একবার আবর্তনের সময়"
                    ],
                    "answer":2
                },
                {
                    "q":"গঙ্গা, যমুনা ও সরস্বতী নদী কোন শহরের পাশ দিয়ে বয়ে গেছে?",
                    "options":[
                    "বারাণসী",
                    "হরিদ্বার",
                    "এলাহাবাদ (প্রয়াগরাজ)",
                    "কানপুর"
                    ],
                    "answer":2
                }

                
            ];
            
            /* ==========================
            START QUIZ FUNCTION
            ========================== */

            function startQuiz(){

                /* Save Questions */

                localStorage.setItem(
                    "quizQuestions",
                    JSON.stringify(questions)
                );

                /* Save Topic Name */

                localStorage.setItem(
                    "quizTitle",
                    "Quiz"
                );

                /* Reset Previous Result */

                localStorage.removeItem("quizScore");
                localStorage.removeItem("quizWrong");
                localStorage.removeItem("quizTime");

                /* Open Quiz Page */

                window.location.href =
                "../../Quiz Page.html";

            }

            /* ==========================
            PAGE LOAD ANIMATION
            ========================== */

            window.addEventListener("load",function(){

                document.body.style.opacity="0";

                document.body.style.transition=
                "opacity .5s ease";

                setTimeout(function(){

                    document.body.style.opacity="1";

                },100);

            });

            /* ==========================
            BUTTON CLICK EFFECT
            ========================== */

            const btn=
            document.querySelector(".start-btn");

            btn.addEventListener("click",function(){

                btn.style.transform="scale(.98)";

                setTimeout(function(){

                    btn.style.transform="scale(1)";

                },120);

            });

            /* ==========================
            END SCRIPT
            ========================== */

        </script>

    </body>

</html>
