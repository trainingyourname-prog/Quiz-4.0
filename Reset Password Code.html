<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #F9DFA5,
        #F7C76B
    );

    padding:20px;

}

/*==========================
  MAIN BOX
==========================*/

.container{

    width:100%;

    max-width:380px;

    background:#fff;

    border-radius:20px;

    padding:30px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.18);

    animation:fadeIn .5s;

}

/*==========================
  LOGO
==========================*/

.logo{

    display:block;

    width:140px;

    height:140px;

    margin:auto;

    margin-bottom:20px;

    object-fit:cover;

    border-radius:50%;

    box-shadow:
    0 6px 15px rgba(0,0,0,.15);

}

/*==========================
  TITLE
==========================*/

h2{

    text-align:center;

    font-size:30px;

    color:#333;

    margin-bottom:25px;

}

/*==========================
  INPUT
==========================*/

.input-group{

    margin-bottom:15px;

}

.input-group input{

    width:100%;

    padding:15px;

    border:none;

    outline:none;

    border-radius:12px;

    background:#f1f1f1;

    font-size:16px;

    transition:.3s;

}

.input-group input:focus{

    background:#fff;

    box-shadow:
    0 0 0 2px #f7c54b;

}

/*==========================
  BUTTON
==========================*/

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:20px;

    font-weight:bold;

    background:#F6D56E;

    color:#222;

    transition:.3s;

}

button:hover{

    background:#f2c640;

    transform:translateY(-2px);

}

button:disabled{

    opacity:.6;

    cursor:not-allowed;

}

/*==========================
  LOADER
==========================*/

.loader{

    display:none;

    text-align:center;

    margin-top:15px;

    color:#555;

    font-size:15px;

}

/*==========================
  LINK
==========================*/

a{

    display:block;

    margin-top:18px;

    text-align:center;

    color:#B8860B;

    text-decoration:none;

}

a:hover{

    text-decoration:underline;

}

/*==========================
  FOOTER
==========================*/

.footer{

    margin-top:18px;

    text-align:center;

    color:#777;

    font-size:13px;

}

hr{

    margin-top:25px;

    border:none;

    border-top:1px solid #ddd;

}

/*==========================
  Animation
==========================*/

@keyframes fadeIn{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

/*==========================
  Mobile
==========================*/

@media(max-width:480px){

.container{

    padding:22px;

}

.logo{

    width:120px;

    height:120px;

}

h2{

    font-size:26px;

}

button{

    font-size:18px;

}

}

</style>

</head>


<body>

<div class="container">

    <!-- Logo -->

    <img
            src="logo 1.jpg"
            class="logo"
            alt="Logo">

    <!-- Title -->

    <h2>Reset Password</h2>

    <!-- OTP -->

    <div class="input-group">

        <input
            id="otp"
            type="text"
            maxlength="6"
            inputmode="numeric"
            placeholder="🔑 Enter OTP">

    </div>

    <!-- New Password -->

    <div class="input-group">

        <input
            id="newPassword"
            type="password"
            placeholder="🔒 New Password">

    </div>

    <!-- Show Password -->

    <div
        style="text-align:left;margin-bottom:15px;">

        <label
            style="font-size:15px;cursor:pointer;">

            <input
                type="checkbox"
                onclick="togglePassword()">

            Show Password

        </label>

    </div>

    <!-- Reset Button -->

    <button
        id="resetBtn"
        onclick="resetPassword()">

        Reset Password

    </button>

    <!-- Loader -->

    <div
        id="loader"
        class="loader">

        ⏳ Please wait...

    </div>

    <!-- Back -->

    <a
        href="Login Home Page.html">

        ← Back to Login

    </a>

    <hr>

    <div class="footer">

        © Quiz 4.0  2026

    </div>

</div>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbxDsK5LQrxkq-E59F_OoTAQCGYNBEhw5XOzjQjHMKne5ks9u8-PSwJZqDUDrJCYB-k/exec";

const email =
localStorage.getItem("resetEmail");

/*=========================
  Shortcut
=========================*/

function $(id){

    return document.getElementById(id);

}



/*=========================================
  Send OTP Automatically
=========================================*/

window.onload = async function(){

    if(!email){

        Swal.fire({

            icon:"error",

            title:"Email Not Found",

            text:"Please login again."

        }).then(()=>{

            location.href="Login Home Page.html";

        });

        return;

    }

    $("loader").style.display="block";

    try{

        const res = await fetch(

            WEBAPP_URL,

            {

                method:"POST",

                body:JSON.stringify({

                    action:"forgot",

                    email:email

                })

            }

        );

        const json = await res.json();

        $("loader").style.display="none";

        Swal.fire({

            icon:
            json.status==="success"
            ? "success"
            : "error",

            title:
            json.status==="success"
            ? "OTP Sent"
            : "Error",

            text:json.message

        });

    }

    catch(err){

        $("loader").style.display="none";

        Swal.fire({

            icon:"error",

            title:"Connection Error",

            text:"Unable to connect to server."

        });

    }

};


/*=========================================
  Show / Hide Password
=========================================*/

function togglePassword(){

    const pass = $("newPassword");

    pass.type =
    pass.type==="password"
    ? "text"
    : "password";

}


/*=========================================
  Reset Password
=========================================*/

async function resetPassword(){

    const otp = $("otp").value.trim();

    const password =
    $("newPassword").value.trim();

    if(!otp || !password){

        Swal.fire({

            icon:"warning",

            title:"Missing Information",

            text:"Enter OTP and New Password."

        });

        return;

    }

    if(password.length < 6){

        Swal.fire({

            icon:"warning",

            title:"Weak Password",

            text:"Password must be at least 6 characters."

        });

        return;

    }

    $("resetBtn").disabled=true;

    $("loader").style.display="block";

    try{

        const res = await fetch(

            WEBAPP_URL,

            {

                method:"POST",

                body:JSON.stringify({

                    action:"reset",

                    email:email,

                    otp:otp,

                    password:password

                })

            }

        );

        const json = await res.json();

        $("loader").style.display="none";

        $("resetBtn").disabled=false;

        Swal.fire({

            icon:
            json.status==="success"
            ? "success"
            : "error",

            title:
            json.status==="success"
            ? "Password Reset"
            : "Failed",

            text:json.message

        }).then(()=>{

            if(json.status==="success"){

                localStorage.removeItem(

                    "resetEmail"

                );

                location.href="Login Home Page.html";

            }

        });

    }

    catch(err){

        $("loader").style.display="none";

        $("resetBtn").disabled=false;

        Swal.fire({

            icon:"error",

            title:"Connection Error",

            text:"Unable to connect to server."

        });

    }

}


/*=========================================
  Enter Key Support
=========================================*/

document.addEventListener(

    "keydown",

    function(e){

        if(e.key==="Enter"){

            resetPassword();

        }

    }

);




/*=========================================
  Auto Focus
=========================================*/

window.addEventListener("load",function(){

    $("otp").focus();

});


/*=========================================
  OTP Only Numbers
=========================================*/

$("otp").addEventListener("input",function(){

    this.value=this.value.replace(/\D/g,"");

});


/*=========================================
  Remove Extra Spaces
=========================================*/

$("newPassword").addEventListener(

    "blur",

    function(){

        this.value=this.value.trim();

    }

);


/*=========================================
  Internet Status
=========================================*/

window.addEventListener(

    "offline",

    function(){

        Swal.fire({

            icon:"warning",

            title:"No Internet",

            text:"Please check your internet connection."

        });

    }

);

window.addEventListener(

    "online",

    function(){

        console.log("Internet Connected");

    }

);


/*=========================================
  Prevent Double Submit
=========================================*/

let resetProcessing=false;

const oldResetPassword=resetPassword;

resetPassword=async function(){

    if(resetProcessing){

        return;

    }

    resetProcessing=true;

    try{

        await oldResetPassword();

    }

    finally{

        resetProcessing=false;

    }

};


/*=========================================
  Developer Information
=========================================*/

console.log("================================");

console.log(" Manabraj Quiz Reset v2.0");

console.log(" Android WebView Ready");

console.log(" SweetAlert2 Enabled");

console.log(" Google Apps Script Connected");

console.log("================================");

</script>

</body>

</html>
