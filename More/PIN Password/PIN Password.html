<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Quiz Login</title>

    <style>

        /* =========================================
           BASIC RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BODY
        ========================================= */

        body {

            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            position: relative;

            overflow: hidden;

            background: #111;
        }


        /* =========================================
           BACKGROUND SLIDES
        ========================================= */

        .background-slider {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: -3;

            overflow: hidden;
        }


        .background-slide {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            opacity: 0;

            transform: scale(1.08);

            transition:
                opacity 1.8s ease-in-out,
                transform 5s ease-in-out;

        }


        .background-slide.active {

            opacity: 1;

            transform: scale(1);
        }


        /* =========================================
           BACKGROUND IMAGES
        ========================================= */

        .slide-1 {
            background-image:
                url("Background IMG 1.jpeg");
        }

        .slide-2 {
            background-image:
                url("Background IMG 2.jpeg");
        }

        .slide-3 {
            background-image:
                url("Background IMG 3.jpeg");
        }

        .slide-4 {
            background-image:
                url("Background IMG 4.jpeg");
        }

        .slide-5 {
            background-image:
                url("Background IMG 5.jpeg");
        }

        .slide-6 {
            background-image:
                url("Background IMG 6.jpeg");
        }


        /* =========================================
           CLASSIC DARK OVERLAY
        ========================================= */

        body::before {

            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 0, 0, 0.70),
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.70)
                );

            z-index: -2;

            pointer-events: none;
        }


        /* =========================================
           CLASSIC LIGHT EFFECT
        ========================================= */

        body::after {

            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,0.08),
                    transparent 60%
                );

            z-index: -1;

            pointer-events: none;
        }


        /* =========================================
           LOGIN CONTAINER
        ========================================= */

        .login-container {

            position: relative;

            z-index: 2;

            width: 100%;
            max-width: 380px;

            padding: 42px 30px;

            text-align: center;

            border-radius: 20px;

            /* Classic Glass */

            background:
                rgba(255, 255, 255, 0.13);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            /* Classic Border */

            border:
                1px solid
                rgba(255, 255, 255, 0.45);

            /* Premium Shadow */

            box-shadow:

                0 20px 60px
                rgba(0, 0, 0, 0.65),

                inset 0 1px 1px
                rgba(255, 255, 255, 0.35),

                inset 0 -1px 1px
                rgba(0, 0, 0, 0.25);

            animation:
                cardAnimation
                1.2s
                ease-out;
        }


        /* =========================================
           CARD ENTRANCE ANIMATION
        ========================================= */

        @keyframes cardAnimation {

            0% {

                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.94);

            }

            100% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            width: 140px;
            height: 140px;

            object-fit: cover;

            border-radius: 50%;

            padding: 5px;

            background: white;

            border:
                3px solid
                rgba(255,255,255,0.85);

            box-shadow:

                0 0 12px
                rgba(255,255,255,0.95),

                0 0 30px
                rgba(255,215,0,0.65),

                0 0 55px
                rgba(255,180,0,0.45);

            animation:
                logoAnimation
                4s
                ease-in-out
                infinite;
        }


        /* =========================================
           LOGO ANIMATION
        ========================================= */

        @keyframes logoAnimation {

            0% {

                transform:
                    translateY(0)
                    scale(1)
                    rotate(0deg);

            }

            50% {

                transform:
                    translateY(-8px)
                    scale(1.04)
                    rotate(1deg);

            }

            100% {

                transform:
                    translateY(0)
                    scale(1)
                    rotate(0deg);

            }
        }


        /* =========================================
           PASSWORD BOX
        ========================================= */

        .password-box {

            position: relative;

            width: 100%;

            margin-top: 35px;
        }


        /* =========================================
           PASSWORD INPUT
        ========================================= */

        .password-box input {

            width: 100%;

            height: 55px;

            padding:
                0 55px
                0 18px;

            font-family:
                Arial,
                sans-serif;

            font-size: 16px;

            color: #222;

            background:
                rgba(255,255,255,0.95);

            border: none;

            outline: none;

            border-radius: 12px;

            box-shadow:

                0 6px 20px
                rgba(0,0,0,0.30);

            transition:
                0.3s;
        }


        .password-box input:focus {

            box-shadow:

                0 0 0 3px
                rgba(255,215,0,0.35),

                0 8px 25px
                rgba(0,0,0,0.35);
        }


        .password-box input::placeholder {

            color: #777;
        }


        /* =========================================
           SHOW / HIDE PASSWORD
        ========================================= */

        .toggle-password {

            position: absolute;

            right: 17px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 21px;

            cursor: pointer;

            user-select: none;

            transition:
                0.2s;
        }


        .toggle-password:hover {

            transform:
                translateY(-50%)
                scale(1.15);
        }


        /* =========================================
           OK BUTTON
        ========================================= */

        .ok-button {

            width: 100%;

            height: 55px;

            margin-top: 20px;

            border: none;

            border-radius: 12px;

            background:

                linear-gradient(
                    135deg,
                    #b8860b,
                    #f6d365,
                    #b8860b
                );

            color: #fff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 17px;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            box-shadow:

                0 8px 22px
                rgba(0,0,0,0.35),

                inset 0 1px 1px
                rgba(255,255,255,0.5);

            transition:
                all 0.3s ease;
        }


        .ok-button:hover {

            transform:
                translateY(-3px);

            box-shadow:

                0 12px 28px
                rgba(0,0,0,0.45),

                0 0 20px
                rgba(255,215,0,0.35);
        }


        .ok-button:active {

            transform:
                scale(0.96);
        }


        /* =========================================
           ERROR MESSAGE
        ========================================= */

        .error-message {

            display: none;

            margin-top: 15px;

            padding: 10px;

            border-radius: 8px;

            background:
                rgba(255,0,0,0.18);

            color: #ffe5e5;

            font-family:
                Arial,
                sans-serif;

            font-size: 14px;

            animation:
                errorAnimation
                0.3s
                ease;
        }


        /* =========================================
           ERROR ANIMATION
        ========================================= */

        @keyframes errorAnimation {

            0% {
                transform: translateX(-10px);
            }

            25% {
                transform: translateX(10px);
            }

            50% {
                transform: translateX(-7px);
            }

            75% {
                transform: translateX(7px);
            }

            100% {
                transform: translateX(0);
            }
        }


        /* =========================================
           MOBILE RESPONSIVE
        ========================================= */

        @media (max-width: 480px) {

            body {

                padding: 15px;
            }


            .login-container {

                max-width: 350px;

                padding:
                    35px 22px;

                border-radius:
                    20px;
            }


            .logo {

                width: 120px;

                height: 120px;
            }


            .password-box {

                margin-top: 30px;
            }
        }


        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 360px) {

            .login-container {

                padding:
                    30px 18px;
            }


            .logo {

                width: 105px;

                height: 105px;
            }


            .password-box input,
            .ok-button {

                height: 52px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         BACKGROUND SLIDER
    ========================================= -->

    <div class="background-slider">

        <div
            class="background-slide slide-1 active">
        </div>

        <div
            class="background-slide slide-2">
        </div>

        <div
            class="background-slide slide-3">
        </div>

        <div
            class="background-slide slide-4">
        </div>

        <div
            class="background-slide slide-5">
        </div>

        <div
            class="background-slide slide-6">
        </div>

    </div>


    <!-- =========================================
         LOGIN CONTAINER
    ========================================= -->

    <div class="login-container">


        <!-- LOGO -->

        <img
            src="Logo.jpg"
            class="logo"
            alt="Logo"
        >


        <!-- PASSWORD -->

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                autocomplete="off"
                onkeydown="handleEnter(event)"
            >


            <!-- SHOW / HIDE -->

            <span
                class="toggle-password"
                id="toggleIcon"
                onclick="togglePassword()"
            >
                👁️
            </span>

        </div>


        <!-- ERROR -->

        <div
            class="error-message"
            id="errorMessage"
        >
            Incorrect Password!
        </div>


        <!-- OK BUTTON -->

        <button
            class="ok-button"
            onclick="checkPassword()"
        >
            OK
        </button>


    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /* =========================================
           PASSWORD
        ========================================= */

        const CORRECT_PASSWORD = "2000";


        /* =========================================
           BACKGROUND SLIDER
        ========================================= */

        const slides =
            document.querySelectorAll(
                ".background-slide"
            );

        let currentSlide = 0;


        function changeBackground() {

            slides[currentSlide]
                .classList.remove("active");


            currentSlide++;

            if (
                currentSlide >=
                slides.length
            ) {

                currentSlide = 0;
            }


            slides[currentSlide]
                .classList.add("active");
        }


        /*
         * Change image every 3 seconds
         */

        setInterval(
            changeBackground,
            3000
        );


        /* =========================================
           SHOW / HIDE PASSWORD
        ========================================= */

        function togglePassword() {

            const passwordInput =
                document.getElementById(
                    "password"
                );

            const toggleIcon =
                document.getElementById(
                    "toggleIcon"
                );


            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                toggleIcon.innerHTML =
                    "🙈";

            }

            else {

                passwordInput.type =
                    "password";

                toggleIcon.innerHTML =
                    "👁️";
            }

        }


        /* =========================================
           CHECK PASSWORD
        ========================================= */

        function checkPassword() {

            const passwordInput =
                document.getElementById(
                    "password"
                );

            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );

            const password =
                passwordInput.value;


            /* Empty Password */

            if (
                password === ""
            ) {

                errorMessage.innerHTML =
                    "Please Enter Password!";

                errorMessage.style.display =
                    "block";

                passwordInput.focus();

                return;
            }


            /* Correct Password */

            if (
                password ===
                CORRECT_PASSWORD
            ) {

                /*
                 * Open Quiz Page
                 */

                window.location.href =
                    "../More.html";

            }


            /* Wrong Password */

            else {

                errorMessage.innerHTML =
                    "Incorrect Password!";

                errorMessage.style.display =
                    "block";

                passwordInput.value =
                    "";

                passwordInput.focus();
            }

        }


        /* =========================================
           ENTER KEY LOGIN
        ========================================= */

        function handleEnter(event) {

            if (
                event.key ===
                "Enter"
            ) {

                checkPassword();
            }

        }

    </script>


</body>

</html>
