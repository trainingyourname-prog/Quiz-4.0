<!DOCTYPE html>
    <html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

        <title>Student Login</title>

        <!-- SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <style>

            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                font-family:Arial,Helvetica,sans-serif;
            }

            body{

                min-height:100vh;

                display:flex;

                justify-content:center;

                align-items:center;

                background:
                linear-gradient(
                135deg,
                #F9DFA5,
                #F7C76B);

                padding:20px;

            }

            /*=========================
            LOGIN BOX
            =========================*/

            .container{

                width:100%;

                max-width:380px;

                background:#fff;

                border-radius:20px;

                padding:30px;

                box-shadow:

                0 15px 40px rgba(0,0,0,.18);

                animation:fadeIn .5s;

            }

            /*=========================
            LOGO
            =========================*/

            .logo{

                display:block;

                width:140px;

                height:140px;

                margin:auto;

                margin-bottom:20px;

                border-radius:50%;

                object-fit:cover;

                box-shadow:

                0 6px 15px rgba(0,0,0,.15);

            }

            /*=========================
            TITLE
            =========================*/

            h2{

                text-align:center;

                font-size:30px;

                margin-bottom:25px;

                color:#333;

            }

            /*=========================
            INPUT
            =========================*/

            .input-group{

                margin-bottom:15px;

            }

            .input-group input{

                width:100%;

                padding:15px;

                border:none;

                outline:none;

                border-radius:12px;

                background:#f1f1f1;

                font-size:16px;

                transition:.3s;

            }

            .input-group input:focus{

                background:#fff;

                box-shadow:

                0 0 0 2px #f7c54b;

            }

            /*=========================
            BUTTON
            =========================*/

            button{

                width:100%;

                border:none;

                border-radius:12px;

                padding:15px;

                font-size:20px;

                font-weight:bold;

                cursor:pointer;

                transition:.3s;

                background:#F6D56E;

                color:#222;

            }

            button:hover{

                transform:translateY(-2px);

                background:#f2c640;

            }

            button:disabled{

                opacity:.6;

                cursor:not-allowed;

            }

            /*=========================
            LINK
            =========================*/

            a{

                display:block;

                margin-top:18px;

                text-align:center;

                text-decoration:none;

                color:#B8860B;

                font-size:16px;

            }

            a:hover{

                text-decoration:underline;

            }

            /*=========================
            HR
            =========================*/

            hr{

                margin-top:25px;

                border:none;

                border-top:1px solid #ddd;

            }

            /*=========================
            FOOTER
            =========================*/

            .footer{

                text-align:center;

                margin-top:15px;

                color:#777;

                font-size:13px;

            }

            /*=========================
            LOADING
            =========================*/

            .loader{

                display:none;

                margin-top:15px;

                text-align:center;

                color:#555;

                font-size:15px;

            }

            /*=========================
            ANIMATION
            =========================*/

            @keyframes fadeIn{

                from{

                    opacity:0;

                    transform:translateY(20px);

                }

                to{

                    opacity:1;

                    transform:translateY(0);

                }

            }

            /*=========================
            MOBILE
            =========================*/

            @media(max-width:480px){

            .container{

                padding:22px;

            }

            .logo{

                width:120px;

                height:120px;

            }

            h2{

                font-size:26px;

            }

            button{

                font-size:18px;

            }

            }

        </style>

    </head>
    

    <body>

        <div class="container">

            <!-- Logo -->

            <img
                src="logo 1.jpg"
                class="logo"
                alt="Logo">

            <!-- Title -->

            <h2>Student Login</h2>

            <!-- Student Name -->

            <div class="input-group">

                <input
                id="name"
                type="text"
                placeholder="👤 Student Name"
                autocomplete="off">

            </div>

            <!-- WhatsApp Number -->

            <div class="input-group">

                <input
                id="phone"
                type="tel"
                maxlength="10"
                inputmode="numeric"
                placeholder="📱 WhatsApp Number"
                autocomplete="off">

            </div>

            <!-- Edu Gmail -->

            <div class="input-group">

                <input
                id="email"
                type="email"
                placeholder="📧 Edu Gmail ID"
                autocomplete="off">

            </div>

            <!-- Password -->

            <div class="input-group">

                <input
                id="password"
                type="password"
                placeholder="🔒 Create Password">

            </div>

            <!-- Login Button -->

            <button
            id="loginBtn"
            onclick="login()">

                Log In

            </button>

            <!-- Loading -->

            <div
            id="loader"
            class="loader">

                ⏳ Please wait...

            </div>

            <!-- Forgot Password -->

            <a
            href="javascript:void(0)"
            onclick="forgotPassword()">

                Forgot Password?

            </a>

            <hr>

            <div class="footer">

                © Quiz 4.0 2026

            </div>

        </div>

        <script>

            const WEBAPP_URL =
            "https://script.google.com/macros/s/AKfycbxDsK5LQrxkq-E59F_OoTAQCGYNBEhw5XOzjQjHMKne5ks9u8-PSwJZqDUDrJCYB-k/exec";

            //=========================================
            // Forgot Password
            //=========================================

            function forgotPassword(){

                const email = $("email").value.trim();

                if(email===""){

                    Swal.fire({

                        icon:"warning",

                        title:"Email Required",

                        text:"Please enter your Edu Gmail ID."

                    });

                    return;

                }

                localStorage.setItem(

                    "resetEmail",

                    email

                );

                location.href="Reset Password Code.html";

            }

            //=========================================
            // Login
            //=========================================

            async function login(){

                const btn=$("loginBtn");

                const loader=$("loader");

                const name=$("name").value.trim();

                const phone=$("phone").value.trim();

                const email=$("email").value.trim();

                const password=$("password").value.trim();

                // Empty Validation

                if(

                    !name ||

                    !phone ||

                    !email ||

                    !password

                ){

                    Swal.fire({

                        icon:"warning",

                        title:"Missing Information",

                        text:"Please fill all fields."

                    });

                    return;

                }

                // WhatsApp Validation

                if(!/^[6-9]\d{9}$/.test(phone)){

                    Swal.fire({

                        icon:"warning",

                        title:"Invalid Number",

                        text:"Please enter a valid 10-digit WhatsApp number."

                    });

                    return;

                }

                // Email Validation

                if(

                    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)

                ){

                    Swal.fire({

                        icon:"warning",

                        title:"Invalid Email",

                        text:"Please enter a valid Edu Gmail ID."

                    });

                    return;

                }

                btn.disabled=true;

                loader.style.display="block";

                try{

                    const res = await fetch(

                        WEBAPP_URL,

                        {

                            method:"POST",

                            body:JSON.stringify({

                                studentName:name,

                                whatsapp:phone,

                                email:email,

                                password:password

                            })

                        }

                    );

                    const json = await res.json();

                    loader.style.display="none";

                    btn.disabled=false;

                    if(json.status==="success"){

                        localStorage.setItem(

                            "login",

                            "yes"

                        );

                        Swal.fire({

                            icon:"success",

                            title:"Login Successful",

                            text:"Welcome "+name,

                            timer:1500,

                            showConfirmButton:false

                        }).then(()=>{

                            location.href="Open Library.html";

                        });

                    }

                    else if(json.status==="registered"){

                        Swal.fire({

                            icon:"success",

                            title:"Registration Completed",

                            text:"Registration completed successfully."

                        });

                    }

                    else{

                        Swal.fire({

                            icon:"error",

                            title:"Login Failed",

                            text:json.message ||

                            "Invalid login information."

                        });

                    }

                }

                catch(err){

                    loader.style.display="none";

                    btn.disabled=false;

                    Swal.fire({

                        icon:"error",

                        title:"Connection Error",

                        text:"Unable to connect to the server."

                    });

                    console.error(err);

                }

            }

            //=========================================
            // Enter Key Login
            //=========================================

            document.addEventListener(

                "keydown",

                function(e){

                    if(e.key==="Enter"){

                        login();

                    }

                }

            );

            //=========================================
            // Shortcut
            //=========================================

            function $(id){

                return document.getElementById(id);

            }


            //=========================================
            // Auto Focus
            //=========================================

            window.addEventListener("load",function(){

                $("name").focus();

            });

            //=========================================
            // Phone Number Only
            //=========================================

            $("phone").addEventListener("input",function(){

                this.value=this.value.replace(/\D/g,"");

            });

            //=========================================
            // Remove Extra Spaces
            //=========================================

            ["name","phone","email"].forEach(function(id){

                $(id).addEventListener("blur",function(){

                    this.value=this.value.trim();

                });

            });

            //=========================================
            // Disable Login Button While Offline
            //=========================================

            window.addEventListener("offline",function(){

                Swal.fire({

                    icon:"warning",

                    title:"No Internet",

                    text:"Please check your internet connection."

                });

            });

            window.addEventListener("online",function(){

                console.log("Internet Connected");

            });

            //=========================================
            // Prevent Multiple Submit
            //=========================================

            let loginProcessing=false;

            const oldLogin=login;

            login=async function(){

                if(loginProcessing) return;

                loginProcessing=true;

                try{

                    await oldLogin();

                }

                finally{

                    loginProcessing=false;

                }

            };

            //=========================================
            // Developer Info
            //=========================================

            console.log("================================");
            console.log(" Manabraj Quiz Login v2.0");
            console.log(" Android WebView Ready");
            console.log(" SweetAlert2 Enabled");
            console.log(" Google Apps Script Connected");
            console.log("================================");

        </script>

    </body>

</html>
