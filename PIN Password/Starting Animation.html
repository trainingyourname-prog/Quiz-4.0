<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>Quiz Login</title>


        <style>

            /* ================================
            BASIC RESET
            ================================= */

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }


            /* ================================
            BODY & BACKGROUND
            ================================= */

            body {

                width: 100%;
                min-height: 100vh;

                display: flex;

                justify-content: center;

                align-items: center;

                padding: 20px;

                font-family: Arial, sans-serif;

                /* Background Image */
                background-image:
                    url("Background IMG.jpeg");

                background-size: cover;

                background-position: center;

                background-repeat: no-repeat;

                background-attachment: fixed;

                position: relative;

                overflow: hidden;
            }


            /* ================================
            DARK OVERLAY
            ================================= */

            body::before {

                content: "";

                position: fixed;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                background:
                    linear-gradient(
                        135deg,
                        rgba(0, 0, 0, 0.55),
                        rgba(0, 0, 0, 0.25)
                    );

                z-index: 0;
            }


            /* ================================
            MAIN LOGIN CARD
            ================================= */

            .login-container {

                position: relative;

                z-index: 2;

                width: 100%;

                max-width: 380px;

                padding: 40px 28px;

                text-align: center;

                border-radius: 25px;

                /* Glass Effect */

                background:
                    rgba(255, 255, 255, 0.15);

                backdrop-filter:
                    blur(15px);

                -webkit-backdrop-filter:
                    blur(15px);

                /* Border */

                border:
                    1px solid
                    rgba(255, 255, 255, 0.35);

                /* Shadow */

                box-shadow:

                    0 15px 40px
                    rgba(0, 0, 0, 0.45),

                    inset 0 1px 1px
                    rgba(255, 255, 255, 0.25);

            }


            /* ================================
            LOGO AREA
            ================================= */

            .logo {

                width: 140px;

                height: 140px;

                object-fit: cover;

                border-radius: 50%;

                padding: 5px;

                background: white;

                border:
                    3px solid
                    rgba(255, 255, 255, 0.8);

                /* Logo Shadow */

                box-shadow:

                    0 0 10px
                    rgba(255, 255, 255, 0.9),

                    0 0 25px
                    rgba(0, 200, 255, 0.8),

                    0 0 50px
                    rgba(0, 150, 255, 0.6);

                /* Animation */

                animation:

                    logoAnimation
                    3s
                    ease-in-out
                    infinite;

            }


            /* ================================
            LOGO ANIMATION
            ================================= */

            @keyframes logoAnimation {

                0% {

                    transform:
                        translateY(0)
                        scale(1);

                    box-shadow:

                        0 0 10px
                        rgba(255, 255, 255, 0.9),

                        0 0 25px
                        rgba(0, 200, 255, 0.8),

                        0 0 50px
                        rgba(0, 150, 255, 0.6);
                }


                50% {

                    transform:
                        translateY(-10px)
                        scale(1.04);

                    box-shadow:

                        0 0 15px
                        rgba(255, 255, 255, 1),

                        0 0 35px
                        rgba(0, 220, 255, 1),

                        0 0 70px
                        rgba(0, 150, 255, 0.9);
                }


                100% {

                    transform:
                        translateY(0)
                        scale(1);

                    box-shadow:

                        0 0 10px
                        rgba(255, 255, 255, 0.9),

                        0 0 25px
                        rgba(0, 200, 255, 0.8),

                        0 0 50px
                        rgba(0, 150, 255, 0.6);
                }

            }


            /* ================================
            PASSWORD BOX
            ================================= */

            .password-box {

                position: relative;

                width: 100%;

                margin-top: 35px;

            }


            /* Password Input */

            .password-box input {

                width: 100%;

                height: 55px;

                padding:

                    0 55px
                    0 18px;

                font-size: 16px;

                color: #222;

                background:
                    rgba(255, 255, 255, 0.95);

                border: none;

                outline: none;

                border-radius: 12px;

                box-shadow:

                    0 5px 15px
                    rgba(0, 0, 0, 0.25);

                transition:
                    0.3s;

            }


            /* Input Focus */

            .password-box input:focus {

                box-shadow:

                    0 0 0 3px
                    rgba(0, 150, 255, 0.4),

                    0 5px 20px
                    rgba(0, 0, 0, 0.3);

            }


            /* Placeholder */

            .password-box input::placeholder {

                color: #777;

            }


            /* ================================
            SHOW / HIDE PASSWORD ICON
            ================================= */

            .toggle-password {

                position: absolute;

                right: 17px;

                top: 50%;

                transform:
                    translateY(-50%);

                font-size: 21px;

                cursor: pointer;

                user-select: none;

                transition:
                    0.2s;

            }


            .toggle-password:hover {

                transform:
                    translateY(-50%)
                    scale(1.15);

            }


            /* ================================
            OK BUTTON
            ================================= */

            .ok-button {

                width: 100%;

                height: 55px;

                margin-top: 20px;

                border: none;

                border-radius: 12px;

                background:

                    linear-gradient(
                        135deg,
                        #007bff,
                        #00c6ff
                    );

                color: white;

                font-size: 17px;

                font-weight: bold;

                letter-spacing: 1px;

                cursor: pointer;

                box-shadow:

                    0 7px 20px
                    rgba(0, 123, 255, 0.4);

                transition:
                    0.3s;

            }


            /* Button Hover */

            .ok-button:hover {

                transform:
                    translateY(-3px);

                box-shadow:

                    0 10px 25px
                    rgba(0, 200, 255, 0.6);

            }


            /* Button Click */

            .ok-button:active {

                transform:
                    scale(0.96);

            }


            /* ================================
            ERROR MESSAGE
            ================================= */

            .error-message {

                display: none;

                margin-top: 15px;

                padding: 10px;

                border-radius: 8px;

                background:
                    rgba(255, 0, 0, 0.15);

                color: #ffdddd;

                font-size: 14px;

                animation:

                    errorAnimation
                    0.3s
                    ease;

            }


            /* Error Animation */

            @keyframes errorAnimation {

                0% {
                    transform:
                        translateX(-10px);
                }

                25% {
                    transform:
                        translateX(10px);
                }

                50% {
                    transform:
                        translateX(-7px);
                }

                75% {
                    transform:
                        translateX(7px);
                }

                100% {
                    transform:
                        translateX(0);
                }

            }


            /* ================================
            MOBILE RESPONSIVE
            ================================= */

            @media
            (max-width: 480px) {

                .login-container {

                    padding:
                        35px 22px;

                    border-radius:
                        22px;

                }


                .logo {

                    width:
                        120px;

                    height:
                        120px;

                }

            }

        </style>

    </head>

    <body>
        
        <!-- =================================
            LOGIN CONTAINER
        ================================== -->

        <div class="login-container">


            <!-- LOGO -->

            <img
                src="Logo.jpg"
                class="logo"
                alt="Logo"
            >


            <!-- PASSWORD INPUT -->

            <div class="password-box">


                <input

                    type="password"

                    id="password"

                    placeholder="Enter Password"

                    autocomplete="off"

                    onkeydown="
                        handleEnter(event)
                    "

                >


                <!-- SHOW / HIDE ICON -->

                <span

                    class="toggle-password"

                    id="toggleIcon"

                    onclick="
                        togglePassword()
                    "

                >
                    👁️
                </span>


            </div>


            <!-- ERROR MESSAGE -->

            <div

                class="error-message"

                id="errorMessage"

            >
                Incorrect Password!

            </div>


            <!-- OK BUTTON -->

            <button

                class="ok-button"

                onclick="
                    checkPassword()
                "

            >
                OK

            </button>


        </div>


        <!-- =================================
            JAVASCRIPT
        ================================== -->

        <script>


            /* ================================
            PASSWORD
            ================================= */

            const CORRECT_PASSWORD =
                "2000";


            /* ================================
            SHOW / HIDE PASSWORD
            ================================= */

            function togglePassword() {


                const passwordInput =
                    document.getElementById(
                        "password"
                    );


                const toggleIcon =
                    document.getElementById(
                        "toggleIcon"
                    );


                if (
                    passwordInput.type ===
                    "password"
                ) {


                    passwordInput.type =
                        "text";


                    toggleIcon.innerHTML =
                        "🙈";


                }

                else {


                    passwordInput.type =
                        "password";


                    toggleIcon.innerHTML =
                        "👁️";


                }

            }


            /* ================================
            CHECK PASSWORD
            ================================= */

            function checkPassword() {


                const passwordInput =
                    document.getElementById(
                        "password"
                    );


                const errorMessage =
                    document.getElementById(
                        "errorMessage"
                    );


                const password =
                    passwordInput.value;


                /* Empty Password */

                if (
                    password === ""
                ) {


                    errorMessage.innerHTML =
                        "Please Enter Password!";


                    errorMessage.style.display =
                        "block";


                    passwordInput.focus();


                    return;

                }


                /* Correct Password */

                if (
                    password ===
                    CORRECT_PASSWORD
                ) {


                    /*
                        Directly Open Quiz Page
                    */

                    window.location.href =
                        "../More/More.html";


                }


                /* Wrong Password */

                else {


                    errorMessage.innerHTML =
                        "Incorrect Password!";


                    errorMessage.style.display =
                        "block";


                    passwordInput.value =
                        "";


                    passwordInput.focus();

                }

            }


            /* ================================
            ENTER KEY LOGIN
            ================================= */

            function handleEnter(event) {


                if (
                    event.key ===
                    "Enter"
                ) {


                    checkPassword();

                }

            }


        </script>

    </body>
</html>
