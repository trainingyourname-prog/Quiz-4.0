<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Library</title>

        <style>
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                font-family:Georgia, serif;
            }

            body{
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                background:linear-gradient(to bottom,#6478e8,#7752b5);
            }

            .card{
                width:90%;
                max-width:360px;
                background:#fff;
                border-radius:35px;
                text-align:center;
                padding:45px 25px;
                box-shadow:0 10px 30px rgba(0,0,0,.15);
            }

            .logo{
                font-size:75px;
                margin-bottom:10px;
            }

            h1{
                font-size:48px;
                color:#111;
                font-weight:bold;
            }

            .subtitle{
                color:#777;
                font-size:18px;
                margin-top:12px;
                margin-bottom:40px;
            }

            .button{
                display:block;
                width:100%;
                margin-top:18px;
                padding:14px;
                border-radius:25px;
                text-decoration:none;
                text-align:center;
                font-size:26px;
                font-weight:bold;
                color:#fff;
                background:linear-gradient(135deg,#3d73a5,#108677);
                box-shadow:0 10px 20px rgba(255,75,43,.35);
                transition:.3s;
            }

            .button:hover{
                transform:scale(1.02);
                box-shadow:0 12px 24px rgba(255,75,43,.45);
                background:linear-gradient(135deg,#2d8305,#19a56b);
            }

            @media(max-width:400px){
                h1{
                    font-size:42px;
                }

                .button{
                    font-size:22px;
                }
            }


        </style>

    </head>

    
    <body>

        <div class="card">

            <div class="logo">📚</div>

            <h1>Quiz Library</h1>

            <div class="subtitle">
                Study Notes &amp; Books Library
            </div>

            <a href="Choose Class Button.html" class="button">
                📖 Open Library
            </a>

        </div>

    </body>
</html>
